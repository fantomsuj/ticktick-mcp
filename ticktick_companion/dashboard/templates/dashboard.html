<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TickTick triage</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}" />
  <script src="https://unpkg.com/htmx.org@2.0.4" integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+" crossorigin="anonymous"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">✓</span>
      <h1>Triage</h1>
      <span class="tz">{{ tz }}</span>
    </div>
    <nav class="tabs" id="tabs">
      {% for p in panels %}
        <button
          class="tab"
          data-panel="{{ p }}"
          hx-get="{{ url_for('panel', name=p) }}"
          hx-target="#panel"
          hx-swap="innerHTML"
          hx-on::after-request="document.querySelectorAll('.tab').forEach(t => t.classList.remove('active')); this.classList.add('active');"
        >
          {% if p == 'home' %}Home{% elif p == 'focus' %}Focus{% elif p == 'triage' %}Overdue{% elif p == 'eod' %}End of Day{% else %}{{ p|capitalize }}{% endif %}
          <span class="badge" data-count="{{ p }}">
            {% if counts.get(p) %}{{ counts[p] }}{% endif %}
          </span>
        </button>
      {% endfor %}
    </nav>
    <div class="actions">
      <span
        id="refresh-meta"
        class="refresh-meta{% if cache.last_refresh_error %} error{% endif %}"
        title="{{ cache.last_refresh_error }}"
      >{{ cache.last_refresh_label }}</span>
      <button
        class="ghost"
        hx-post="{{ url_for('refresh') }}"
        hx-swap="none"
        title="Pull fresh data from TickTick"
      >↻ Refresh</button>
    </div>
  </header>

  <div class="drop-dock" aria-label="Task move targets">
    <div class="drop-zone target-today" data-drag-target="today">Today</div>
    <div class="drop-zone target-tomorrow" data-drag-target="tomorrow">Tomorrow</div>
    <div class="drop-zone target-week" data-drag-target="week">+3d</div>
    <div class="drop-zone target-waiting" data-drag-target="waiting">Waiting</div>
    <div class="drop-zone target-someday" data-drag-target="someday">Someday</div>
  </div>

  <main id="panel" hx-get="{{ url_for('panel', name='home') }}" hx-trigger="load">
    <div class="loading">Loading…</div>
  </main>

  <div id="modal-root"></div>

  <div
    id="counts"
    hx-get="{{ url_for('counts') }}"
    hx-trigger="load, refreshCounts from:body, every 60s"
    hx-swap="innerHTML"
    style="display:none"
  ></div>

  <script>
    // Mark the first tab active on load
    document.addEventListener('DOMContentLoaded', () => {
      const first = document.querySelector('.tab[data-panel="home"]');
      if (first) first.classList.add('active');
    });

    // Refresh counts updates the badge spans embedded in tab buttons.
    document.body.addEventListener('htmx:afterSwap', (e) => {
      if (e.detail.target.id === 'counts') {
        const newCounts = e.detail.target.querySelectorAll('[data-tab-count]');
        newCounts.forEach(span => {
          const panel = span.dataset.tabCount;
          const target = document.querySelector(`.badge[data-count="${panel}"]`);
          if (target) target.textContent = span.textContent.trim();
        });
        const meta = e.detail.target.querySelector('[data-refresh-meta]');
        const refreshMeta = document.querySelector('#refresh-meta');
        if (meta && refreshMeta) {
          const error = meta.dataset.refreshError || '';
          const projectErrorCount = Number(meta.dataset.projectErrorCount || '0');
          refreshMeta.textContent = meta.textContent.trim();
          refreshMeta.title = error || (projectErrorCount ? `${projectErrorCount} project refresh issue(s)` : '');
          refreshMeta.classList.toggle('error', Boolean(error));
          refreshMeta.classList.toggle('warn', !error && projectErrorCount > 0);
        }
      }
    });

    document.body.addEventListener('reloadPanel', () => {
      document.querySelector('.tab.active')?.click();
    });

    // Keyboard shortcuts: 1..9 jump to tabs, r refreshes.
    document.addEventListener('keydown', (e) => {
      if (e.target.matches('input,textarea,select')) return;
      const map = {'1':'home','2':'focus','3':'triage','4':'today','5':'tomorrow','6':'inbox','7':'waiting','8':'someday','9':'eod'};
      if (map[e.key]) {
        const tab = document.querySelector(`.tab[data-panel="${map[e.key]}"]`);
        if (tab) tab.click();
      } else if (e.key === 'r' && !e.metaKey && !e.ctrlKey) {
        document.querySelector('.actions .ghost')?.click();
      }
    });

    let draggedTask = null;

    document.addEventListener('dragstart', (e) => {
      const handle = e.target.closest('.drag-handle');
      if (!handle) return;
      const card = handle.closest('[data-draggable-task]');
      if (!card) return;
      draggedTask = {
        taskId: card.dataset.taskId,
        projectId: card.dataset.projectId,
      };
      card.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', JSON.stringify(draggedTask));
    });

    document.addEventListener('dragend', () => {
      document.querySelectorAll('.card.dragging').forEach(card => card.classList.remove('dragging'));
      document.querySelectorAll('.drop-zone.drag-over').forEach(zone => zone.classList.remove('drag-over'));
      draggedTask = null;
    });

    document.addEventListener('dragover', (e) => {
      const zone = e.target.closest('[data-drag-target]');
      if (!zone || !draggedTask) return;
      e.preventDefault();
      zone.classList.add('drag-over');
      e.dataTransfer.dropEffect = 'move';
    });

    document.addEventListener('dragleave', (e) => {
      const zone = e.target.closest('[data-drag-target]');
      if (zone) zone.classList.remove('drag-over');
    });

    document.addEventListener('drop', async (e) => {
      const zone = e.target.closest('[data-drag-target]');
      if (!zone || !draggedTask) return;
      e.preventDefault();
      zone.classList.remove('drag-over');
      zone.classList.add('is-saving');

      const form = new FormData();
      form.append('target', zone.dataset.dragTarget);
      try {
        const res = await fetch(`/task/${draggedTask.projectId}/${draggedTask.taskId}/drag`, {
          method: 'POST',
          body: form,
        });
        if (!res.ok) throw new Error(await res.text());
        document.body.dispatchEvent(new Event('refreshCounts'));
        document.querySelector('.tab.active')?.click();
      } catch (err) {
        console.error(err);
        zone.classList.add('drop-error');
        setTimeout(() => zone.classList.remove('drop-error'), 1200);
      } finally {
        zone.classList.remove('is-saving');
      }
    });
  </script>
</body>
</html>
