<section class="panel">
  <div class="panel-head">
    <div>
      <h2>{{ title }}</h2>
      <p class="muted">{{ subtitle }}</p>
    </div>
    <div class="counter">{{ total_count|default(tasks|length) }} parked</div>
  </div>
  {% if total_count|default(tasks|length) == 0 %}
    <div class="empty">Someday/Maybe is empty.</div>
  {% else %}
    <div class="card-list compact">
      {% include "_cards_page.html" %}
    </div>
  {% endif %}
</section>
