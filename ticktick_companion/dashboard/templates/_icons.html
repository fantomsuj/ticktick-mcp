{% macro icon(name, class_name="icon") -%}
<svg class="{{ class_name }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
  {% if name == "alert" %}
    <path d="m12 3 10 18H2L12 3Z" />
    <path d="M12 9v5" />
    <path d="M12 18h.01" />
  {% elif name == "arrow-right" %}
    <path d="M5 12h14" />
    <path d="m12 5 7 7-7 7" />
  {% elif name == "calendar" %}
    <rect x="3" y="4" width="18" height="18" rx="3" />
    <path d="M8 2v4" />
    <path d="M16 2v4" />
    <path d="M3 10h18" />
  {% elif name == "check" %}
    <path d="m20 6-11 11-5-5" />
  {% elif name == "clock" %}
    <circle cx="12" cy="12" r="9" />
    <path d="M12 7v5l3 2" />
  {% elif name == "diamond" %}
    <path d="m12 3 9 9-9 9-9-9 9-9Z" />
  {% elif name == "external" %}
    <path d="M15 3h6v6" />
    <path d="M10 14 21 3" />
    <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />
  {% elif name == "focus" %}
    <circle cx="12" cy="12" r="8" />
    <circle cx="12" cy="12" r="3" />
    <path d="M12 2v3" />
    <path d="M12 19v3" />
    <path d="M2 12h3" />
    <path d="M19 12h3" />
  {% elif name == "grip" %}
    <circle cx="9" cy="6" r="1.2" fill="currentColor" stroke="none" />
    <circle cx="15" cy="6" r="1.2" fill="currentColor" stroke="none" />
    <circle cx="9" cy="12" r="1.2" fill="currentColor" stroke="none" />
    <circle cx="15" cy="12" r="1.2" fill="currentColor" stroke="none" />
    <circle cx="9" cy="18" r="1.2" fill="currentColor" stroke="none" />
    <circle cx="15" cy="18" r="1.2" fill="currentColor" stroke="none" />
  {% elif name == "home" %}
    <path d="m3 10 9-7 9 7" />
    <path d="M5 10v10h14V10" />
    <path d="M9 20v-6h6v6" />
  {% elif name == "hourglass" %}
    <path d="M6 3h12" />
    <path d="M6 21h12" />
    <path d="M7 3c0 5 5 5 5 9s-5 4-5 9" />
    <path d="M17 3c0 5-5 5-5 9s5 4 5 9" />
  {% elif name == "inbox" %}
    <path d="M22 12h-6l-2 3h-4l-2-3H2" />
    <path d="m5 5-3 7v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3-7Z" />
  {% elif name == "moon" %}
    <path d="M21 13a8 8 0 1 1-10-10 6.5 6.5 0 0 0 10 10Z" />
  {% elif name == "refresh" %}
    <path d="M21 12a9 9 0 0 0-15.4-6.4L3 8" />
    <path d="M3 3v5h5" />
    <path d="M3 12a9 9 0 0 0 15.4 6.4L21 16" />
    <path d="M16 16h5v5" />
  {% elif name == "recovery" %}
    <path d="M4 7h9a4 4 0 0 1 0 8H7" />
    <path d="m7 11-3-4 3-4" />
    <path d="M20 17h-9a4 4 0 0 1 0-8h6" />
    <path d="m17 13 3 4-3 4" />
  {% elif name == "star" %}
    <path fill="currentColor" stroke="currentColor" d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9L12 3Z" />
  {% endif %}
</svg>
{%- endmacro %}
