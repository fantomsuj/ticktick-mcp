<section class="panel">
  <div class="panel-head">
    <div>
      <h2>{{ title }}</h2>
      <p class="muted">{{ subtitle }}</p>
    </div>
    <div class="counter">{{ tasks|length }} pending</div>
  </div>

  {% include "_reflect.html" %}

  {% if tasks|length == 0 %}
    <div class="empty">No "WAITING:" tasks right now.</div>
  {% else %}
    <div class="card-list">
      {% for task in tasks %}
        {% include "_card.html" %}
      {% endfor %}
    </div>
  {% endif %}
</section>
