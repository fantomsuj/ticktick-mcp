<section class="panel">
  <div class="panel-head">
    <div>
      <h2>{{ title }}</h2>
      <p class="muted">{{ subtitle }}</p>
    </div>
    <div class="counter">{{ tasks|length }} overdue</div>
  </div>

  {% if tasks|length == 0 %}
    <div class="empty good">
      🎉 Inbox zero on overdue. Switch to <button class="link" onclick="document.querySelector('.tab[data-panel=today]').click()">Today</button>.
    </div>
  {% else %}
    <div class="card-list">
      {% for task in tasks %}
        {% include "_card.html" %}
      {% endfor %}
    </div>
  {% endif %}
</section>
